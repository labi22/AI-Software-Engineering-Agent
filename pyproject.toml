[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-engineering-agent"
version = "0.1.0"
description = "A minimal AI software engineering agent scaffold."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Software Engineering Agent" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=1.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.2,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
